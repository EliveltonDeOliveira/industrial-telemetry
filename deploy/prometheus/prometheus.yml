# Each service is added here as it is implemented, scraped on its /metrics endpoint.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: simulator
    static_configs:
      - targets: ["simulator:8084"]
  - job_name: bridge
    static_configs:
      - targets: ["bridge:8080"]
  - job_name: telemetry
    static_configs:
      - targets: ["telemetry:8081"]
  - job_name: maintenance
    static_configs:
      - targets: ["maintenance:8082"]
  - job_name: anomaly
    static_configs:
      - targets: ["anomaly:8083"]
