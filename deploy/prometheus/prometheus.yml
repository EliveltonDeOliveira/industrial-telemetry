# Each service is added here as it is implemented, scraped on its /metrics endpoint.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: simulator
    static_configs:
      - targets: ["simulator:8084"]
  - job_name: bridge
    static_configs:
      - targets: ["bridge:8080"]
