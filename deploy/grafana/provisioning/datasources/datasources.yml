# Datasources created when Grafana starts. Credentials come from the compose
# environment, with the development defaults of deploy/.env.example.
apiVersion: 1

datasources:
  # Readings: temperature, vibration and state over time (ADR 0005).
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: $CLICKHOUSE_USER
      defaultDatabase: $CLICKHOUSE_DB
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD

  # OEE, computed by the telemetry API with the rules of ADR 0009 (ADR 0010).
  - name: Telemetry API
    uid: telemetry-api
    type: yesoreyeram-infinity-datasource
    editable: false
    url: http://telemetry:8081
    jsonData:
      auth_method: none

  # Alerts and work orders, read with the read only role grafana (ADR 0005 and 0015).
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    editable: false
    url: postgres:5432
    user: grafana
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: $POSTGRES_GRAFANA_PASSWORD

  # Metrics of every service, for the dashboard Plataforma (ADR 0017 and 0018).
  - name: Prometheus
    uid: prometheus
    type: prometheus
    editable: false
    url: http://prometheus:9090
    jsonData:
      # The scrape_interval of deploy/prometheus/prometheus.yml, so $__rate_interval
      # always covers at least 4 scrapes.
      timeInterval: 15s
      httpMethod: POST
