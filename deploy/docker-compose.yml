# Local infrastructure for industrial-telemetry. Run from deploy/: docker compose up
#
# Credentials are development defaults. Override them in deploy/.env (see .env.example).
# Only Mosquitto listens on the LAN, because the Pi 5 gateway publishes to it.
# Every other port is bound to localhost.

name: industrial-telemetry

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      # Single node in KRaft mode: the same process is broker and controller.
      CLUSTER_ID: cFQJj2mnSNOl4N4eXfCIcA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL serves containers as kafka:9092, EXTERNAL serves the host as localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by kafka-init, never on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in telemetria.bruta alertas telemetria.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 1
        done

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-industrial}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-industrial}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-industrial}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:26.8.36.3
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-industrial}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-industrial}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-industrial}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/migrate.sh", "clickhouse"]

  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial}
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial}
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-migrate:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-industrial}
      PGUSER: ${POSTGRES_USER:-industrial}
      PGPASSWORD: ${POSTGRES_PASSWORD:-industrial}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/migrate.sh", "postgres"]

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  simulator:
    build:
      context: ..
      args:
        SERVICE: simulator
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SIM_MACHINES: ${SIM_MACHINES:-3}
      SIM_INTERVAL: ${SIM_INTERVAL:-1s}
    restart: unless-stopped

  bridge:
    build:
      context: ..
      args:
        SERVICE: bridge
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  telemetry:
    build:
      context: ..
      args:
        SERVICE: telemetry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-industrial}:${CLICKHOUSE_PASSWORD:-industrial}@clickhouse:9000/${CLICKHOUSE_DB:-industrial}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  kafka-data:
  clickhouse-data:
  postgres-data:
  prometheus-data:
  grafana-data:
