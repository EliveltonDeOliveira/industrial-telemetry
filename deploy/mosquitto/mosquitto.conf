# Development broker. Anonymous access lets the simulator and the Pi 5 gateway
# publish without credentials. Mosquitto 2 refuses remote clients without these two lines.
listener 1883
allow_anonymous true

# Keep persistent sessions and queued QoS 1 messages across broker restarts.
persistence true
persistence_location /mosquitto/data/

# The bridge has a persistent session. While it is down, Mosquitto queues its
# QoS 1 messages up to this limit. The default of 1000 lasts about 5 minutes with 3 machines.
max_queued_messages 100000

# QoS 1 messages sent to a client and not acknowledged yet. The bridge only
# acknowledges after Kafka stores the record, about 12 ms with the 10 ms linger of
# franz-go, so the default of 20 capped it at about 1600 messages per second
# (ADR 0019). After a bridge crash, up to this many messages are delivered again.
max_inflight_messages 1000

# Readings are small JSON. Larger packets are refused here, so they never reach
# Kafka, which refuses records above 1 MB.
max_packet_size 65536

log_dest stdout
